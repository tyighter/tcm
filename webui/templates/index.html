<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TitleCardMaker Web Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-icon material-symbols-rounded" aria-hidden="true">dashboard_customize</span>
          <div>
            <h1>TitleCardMaker</h1>
            <p class="subtitle">TV configuration editor</p>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button
          id="toggle-search"
          class="icon-button"
          type="button"
          aria-label="Search"
          aria-expanded="false"
        >
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
        </button>
        <div class="search-group">
          <input
            id="series-search"
            type="search"
            placeholder="Search series..."
            aria-label="Search series"
          />
          <button
            id="close-search"
            class="icon-button search-close"
            type="button"
            aria-label="Hide search"
          >
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>
        <button id="download-sources">
          <span class="material-symbols-rounded" aria-hidden="true">download</span>
          <span class="button-label">Sources</span>
        </button>
        <button id="run-builder">
          <span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>
          <span class="button-label">Build</span>
        </button>
        <button id="match-tmdb">
          <span class="material-symbols-rounded" aria-hidden="true">movie</span>
          <span class="button-label">TMDb</span>
        </button>
        <button id="tautulli-recent">
          <span class="material-symbols-rounded" aria-hidden="true">history</span>
          <span class="button-label">Recent</span>
        </button>
        <button id="expand-all-entries">
          <span class="material-symbols-rounded" aria-hidden="true">unfold_more</span>
          <span class="button-label">Expand</span>
        </button>
        <button id="collapse-all-entries">
          <span class="material-symbols-rounded" aria-hidden="true">unfold_less</span>
          <span class="button-label">Collapse</span>
        </button>
        <button id="add-entry" class="primary">
          <span class="material-symbols-rounded" aria-hidden="true">add</span>
          <span class="button-label">Entry</span>
        </button>
        <button id="save-config" class="accent">
          <span class="material-symbols-rounded" aria-hidden="true">save</span>
          <span class="button-label">Save</span>
        </button>
      </div>
    </header>

    <main id="content" class="content">
      <section id="entries" class="entries"></section>
    </main>

    <div id="modals"></div>

    <template id="toast-template">
      <div class="toast"><span class="toast-message"></span></div>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
