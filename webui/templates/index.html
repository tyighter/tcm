<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TitleCardMaker Web Interface</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <h1>TitleCardMaker</h1>
        <p class="subtitle">TV configuration editor</p>
      </div>
      <div class="header-actions">
        <button
          id="toggle-search"
          class="icon-button"
          type="button"
          aria-label="Search"
          aria-expanded="false"
        >
          🔍
        </button>
        <div class="search-group">
          <input
            id="series-search"
            type="search"
            placeholder="Search series..."
            aria-label="Search series"
          />
          <button
            id="close-search"
            class="icon-button search-close"
            type="button"
            aria-label="Hide search"
          >
            ✕
          </button>
        </div>
        <button id="download-sources">
          <span aria-hidden="true">⬇</span>
          <span class="button-label">Sources</span>
        </button>
        <button id="run-builder">
          <span aria-hidden="true">▶</span>
          <span class="button-label">Build</span>
        </button>
        <button id="expand-all-entries">
          <span aria-hidden="true">⤢</span>
          <span class="button-label">Expand</span>
        </button>
        <button id="collapse-all-entries">
          <span aria-hidden="true">⤡</span>
          <span class="button-label">Collapse</span>
        </button>
        <button id="add-entry" class="primary">
          <span aria-hidden="true">➕</span>
          <span class="button-label">Entry</span>
        </button>
        <button id="save-config" class="accent">
          <span aria-hidden="true">💾</span>
          <span class="button-label">Save</span>
        </button>
      </div>
    </header>

    <main id="content" class="content">
      <section id="entries" class="entries"></section>
    </main>

    <div id="modals"></div>

    <template id="toast-template">
      <div class="toast"><span class="toast-message"></span></div>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
